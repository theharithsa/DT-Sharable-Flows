<script>
(function () {
  'use strict';
  var content = document.getElementById('content');
  var tocEl = document.getElementById('toc');
  var md = document.getElementById('md-source').textContent.replace(/^\n/, '');

  // GitHub-style heading slugs (keeps intra-doc TOC links working)
  var slugCounts = {};
  function slugify(text) {
    var s = text.toLowerCase().trim()
      .replace(/<[^>]+>/g, '')
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-');
    if (slugCounts[s] != null) { slugCounts[s]++; s = s + '-' + slugCounts[s]; }
    else { slugCounts[s] = 0; }
    return s;
  }

  var renderer = new marked.Renderer();
  renderer.heading = function (text, level) {
    return '<h' + level + ' id="' + slugify(text) + '">' + text + '</h' + level + '>';
  };
  renderer.link = function (href, title, text) {
    var url = href || '';
    // Sibling .md links open their generated .html page
    if (/\.md($|#)/i.test(url) && !/^[a-z]+:/i.test(url)) {
      url = url.replace(/\.md($|#)/i, '.html$1');
    }
    var ext = /^https?:/i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return '<a href="' + url + '"' + (title ? ' title="' + title + '"' : '') + ext + '>' + text + '</a>';
  };
  marked.setOptions({ renderer: renderer, gfm: true, breaks: false, mangle: false, headerIds: false });

  // Extract mermaid blocks before parsing
  md = md.replace(/```mermaid\r?\n([\s\S]*?)```/g, function (_, code) {
    return '\n<div class="mermaid-block"><pre class="mermaid">' + code
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre></div>\n';
  });

  content.innerHTML = marked.parse(md);

  // TOC from h2/h3 with scroll-spy
  var heads = content.querySelectorAll('h2, h3');
  if (heads.length > 2) {
    var html = '<div class="toc-title">On this page</div>';
    heads.forEach(function (h) {
      html += '<a class="lvl-' + h.tagName[1] + '" href="#' + h.id + '">' + h.textContent + '</a>';
    });
    tocEl.innerHTML = html;
    var links = tocEl.querySelectorAll('a');
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          links.forEach(function (l) { l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id); });
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    heads.forEach(function (h) { obs.observe(h); });
  }

  // Mermaid
  if (window.mermaid && content.querySelector('pre.mermaid')) {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict', fontFamily: 'DynatraceFlow, Segoe UI, sans-serif' });
    mermaid.run({ nodes: content.querySelectorAll('pre.mermaid') });
  }

  // Deep-link anchor
  if (location.hash) {
    var t = document.getElementById(location.hash.slice(1));
    if (t) t.scrollIntoView();
  }
})();
